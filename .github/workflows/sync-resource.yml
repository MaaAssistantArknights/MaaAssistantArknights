name: Resource Sync

on:
  push:
    branches:
      - dev-v2
    paths:
      - ".github/workflows/sync-resource.yml"
      - "resource/**"
  workflow_dispatch:

jobs:
  sync-resource:
    name: Sync Resource to MaaResource
    if: github.repository_owner == 'MaaAssistantArknights'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Configure git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git show -s

      # tasks/hotfix 下的数据体随资源更新分发，但客户端按 version.json 的 last_updated 判断有无更新；
      # 该目录变化时先把主仓库 version.json bump 并 push 回 dev-v2，再继续下方的正常同步。
      # bump commit 由 GITHUB_TOKEN push，不会再触发本工作流（GitHub 防循环规则），第二跳不存在
      - name: Bump resource version on hotfix changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          changed=""
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              git fetch origin "$BEFORE" --depth=1 --no-tags || true
              changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- resource/tasks/hotfix/ || true)
          fi
          if [ -n "$changed" ]; then
              ts=$(date -u '+%Y-%m-%d %H:%M:%S.000')
              jq --indent 4 --arg ts "$ts" '.last_updated = $ts' resource/version.json > resource/version.tmp.json
              mv resource/version.tmp.json resource/version.json
              git add resource/version.json
              git commit -m "chore: bump resource version"
              git push
          fi

      - name: Checkout MaaResource
        uses: actions/checkout@v7
        with:
          repository: MaaAssistantArknights/MaaResource
          show-progress: false
          ssh-key: ${{secrets.MAA_RESOURCE_DEPLOY}}
          path: MaaResource

      - name: Update MaaResource
        run: |
          export commit_msg=$(git show -s --format=%s)
          cd MaaResource
          shopt -s extglob

          cd resource
          rm -rf !(".gitignore")
          cp -rf ../../resource/* .
          cd ..

          git add .
          git status
          git commit -m "$commit_msg" || exit 0
          git push
